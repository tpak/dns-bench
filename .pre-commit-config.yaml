# Git hooks: lint and format staged files before each commit.
# Setup (once per clone):  uv tool install pre-commit && pre-commit install
# Run on everything:        pre-commit run --all-files
# Hook versions:            Dependabot proposes updates monthly (.github/dependabot.yml);
#                           `pre-commit autoupdate` still works in between
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Type checking, with the settings in pyproject.toml ([tool.mypy]). It checks the files listed
  # there as a whole, not just the staged ones, because a change in one module can break another.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        args: []
        pass_filenames: false

  # Biome for JS, CSS and JSON. pre-commit installs its own Node for this hook;
  # nothing Node-related is added to the repo.
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.15
    hooks:
      - id: biome-check
