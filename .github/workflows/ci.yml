# Lint and test every push to main and every pull request, and main once a week. release.yml reuses
# this workflow, so a release runs exactly the same checks. The `ci-passed` job is the one check branch
# protection requires.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a change nobody pushed still shows up: a new runner image (ubuntu-latest became Ubuntu
  # 26.04 on 2026-10-19), a new Python patch release, a new uv. GitHub emails the owner when a scheduled
  # run fails, and disables the schedule after 60 days without repository activity.
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # a caller (release) gets its own group
  # A new push to a PR supersedes the run in progress; runs on main and release tags always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false # no dependencies to cache; pre-commit's hook envs are cached below
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # The same hooks and pinned versions as a local commit (.pre-commit-config.yaml).
      - run: uvx pre-commit@4.6.2 run --all-files --show-diff-on-failure --color=always

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.13", "3.14"]
        # "3.13" and "3.14" get the newest patch release, but people run whatever their system has:
        # also test the oldest ones. (Ubuntu 26.04's own Python 3.14.4 predates a CPython fix that a
        # test relied on: .project/research/2026-09-29-linux-dead-lan-and-ubuntu-26.md.)
        include:
          - { os: ubuntu-latest, python: "3.13.0" }
          - { os: ubuntu-latest, python: "3.14.0" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python }} # sets UV_PYTHON for every `uv run` below
          enable-cache: false # no dependencies to cache; `uv run` only fetches hatchling to build the project
      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v
      # `uv run` puts the chosen Python first on PATH, so the launcher's `#!/usr/bin/env python3` finds it.
      - name: Launcher, from the checkout and through a symlink in another directory
        run: |
          uv run ./dns-bench --version
          ln -s "$PWD/dns-bench" "$RUNNER_TEMP/dns-bench"
          cd "$RUNNER_TEMP" && uv run ./dns-bench --version # no project here: a plain interpreter
      # The command pyproject.toml's [project.scripts] installs into the project environment.
      - name: Installed dns-bench command
        run: uv run dns-bench --version
      # --no-project: otherwise uv itself refuses 3.12 (pyproject.toml's requires-python) before the
      # launcher gets to run.
      - name: Launcher and python -m refuse Python 3.12 with a clear message
        if: matrix.python == '3.13'
        run: |
          for cmd in "./dns-bench --version" "-m dnsbench --version"; do
            read -ra args <<<"$cmd"
            if out=$(uv run --no-project --python 3.12 python "${args[@]}" 2>&1); then
              echo "::error::'python $cmd' ran under Python 3.12: $out"
              exit 1
            fi
            echo "$out"
            grep -q "needs Python 3.13 or newer" <<<"$out"
          done
      # The one live check of System detection on each OS (the unit tests use recorded outputs): Linux
      # runners use systemd-resolved, so this also covers following its stub to the upstream servers.
      - name: System resolver detection (live; sends no DNS queries)
        run: |
          uv run ./dns-bench --config "$RUNNER_TEMP/detect.json" --runs-dir "$RUNNER_TEMP/runs" config --detect
          grep -q '"System"' "$RUNNER_TEMP/detect.json"

  # One stable check name for branch protection, however the matrix above changes.
  ci-passed:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "lint: $LINT, test: $TEST"
          test "$LINT" = success && test "$TEST" = success
