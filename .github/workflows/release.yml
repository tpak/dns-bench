# Publish a GitHub Release when a vX.Y.Z tag is pushed (the steps are in README.md, "Releasing").
# Run it by hand on main (Actions > release > Run workflow) for a dry run: the same checks, and the
# release notes in the run summary, but nothing is published.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    # Never two releases of one ref at once. Job-level, and not named after the workflow: inside the
    # called ci.yml, github.workflow is "release", so a workflow-level "release-<ref>" group here
    # was the same group as ci.yml's and deadlocked the run before any job started.
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: false
      # Only commits merged into main are released. A dry run on another branch skips this, so changes
      # to this workflow can be tried before they merge; a dry run on main exercises it.
      - name: Check the commit is on main
        if: github.ref_type == 'tag' || github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          # Compare main against this commit: "identical" or "ahead" means main contains it.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq .status)
          case "$status" in
            identical | ahead) echo "$sha is on main ($status)" ;;
            *)
              echo "::error::$sha is not on main (compare status: $status). Merge the release PR, then tag its merge commit."
              exit 1
              ;;
          esac
      - name: Check the tag matches dnsbench.__version__
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(uv run python -c 'import dnsbench; print(dnsbench.__version__)')
          echo "dnsbench.__version__ is $version"
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Tag $REF_NAME does not match dnsbench.__version__ ($version). Bump the version and CHANGELOG.md in a PR, merge it, then tag that commit."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The version's section: from its "## [X.Y.Z]" heading to the next heading or link reference.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]*\]: /) { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no notes under a '## [$VERSION]' heading."
            exit 1
          fi
          { echo "## Release notes for $VERSION"; cat "$RUNNER_TEMP/notes.md"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Create the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
