# Keep the SHA-pinned actions in .github/workflows up to date. Dependabot updates the SHA and the
# version comment beside it together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Skip releases younger than a week: time for a compromised or broken release to be noticed.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
